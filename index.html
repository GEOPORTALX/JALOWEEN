<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bebidas Halloween</title>
<style>
:root{color-scheme:dark;--bg:#170e22;--card:#241634;--tx:#f6eee2;--mu:#b5a5c8;--ac:#ff7a1a;--bl:#3aa0ff;--ok:#8fe05a;--bad:#ff6b66;--bd:#3d2a55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
h1{font:italic 700 24px Georgia,serif;margin:0;padding:calc(14px + env(safe-area-inset-top)) 0 6px;color:var(--ac)}
h3{margin:0 0 6px;font-size:17px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}
small{display:block;color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.prod{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.prod:active{transform:scale(.97)}
.prod .em{font-size:28px}
.bdg{position:absolute;top:6px;right:8px;background:var(--ac);color:#170e22;border-radius:99px;min-width:24px;padding:1px 7px;font-weight:700;text-align:center}
button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;cursor:pointer}
button.pri{background:var(--ac);color:#170e22;border:0;font-weight:700}
button.sm{padding:6px 11px}
button.on{border-color:var(--ac);outline:2px solid var(--ac)}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:#120a1b;color:var(--tx)}
input[type=checkbox]{width:22px;height:22px;flex:none}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.tot{font:700 34px Georgia,serif;color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;background:#120a1b;border:1px solid var(--bd)}
.s1 .tag{border-color:var(--bl);color:var(--bl)}.s2 .tag{border-color:var(--ok);color:var(--ok)}
.ord{border-left:6px solid var(--bd)}.ord.s1{border-left-color:var(--bl)}.ord.s2{border-left-color:var(--ok)}
.bar{height:16px;background:#120a1b;border-radius:99px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--ok))}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k .card{margin:0}.k b{font:700 22px Georgia,serif}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.it>span{flex:1}.it input[type=number]{width:96px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 4px;text-align:left}td input{padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f0818;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 2px;color:var(--mu);font-size:13px}
nav button.on{color:var(--ac);outline:0;box-shadow:inset 0 3px var(--ac)}
</style>
</head>
<body>
<h1>🎃 Bebidas Halloween</h1>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const K='bh_v1',ST=['Pendiente','Preparando','Listo','Entregado'],MET=['Efectivo','Transferencia','Tarjeta','Por cobrar'];
const DEF=()=>({seq:0,fee:4,orders:[],
prods:[
{id:'az',e:'🔵',n:'Azulito',p:100,c:37.64,plan:16},
{id:'mt',e:'🌿',n:'Mojito tradicional',p:100,c:36.74,plan:23},
{id:'mf',e:'🍓',n:'Mojito frutos rojos',p:100,c:23.3,plan:6},
{id:'co',e:'🍺',n:'Michelada Corona',p:100,c:47.79,plan:15},
{id:'vi',e:'🍺',n:'Michelada Victoria',p:100,c:47.79,plan:15},
{id:'es',e:'🧂',n:'Escarchado con vaso',p:20,c:5.06,plan:25},
{id:'ec',e:'🥤',n:'Escarchado en vaso del cliente',p:15,c:2.51,plan:0}],
items:[
{n:'Vodka 1 L',q:'azulitos',p:299,b:1},{n:'Ron blanco 1.75 L',q:'mojitos',p:460,b:1},
{n:'Frutos rojos congelados 454 g',q:'mojito frutos rojos',p:65,b:1},{n:'Vasos 1 L (150)',q:'todos',p:382,b:1},
{n:'Agua mineral 8 × 1.75 L',q:'mojitos',p:229,b:1},{n:'Volt 400 ml (6)',q:'azulitos',p:54,b:1},
{n:'Miguelito mora azul 980 g',q:'solo azulitos',p:75,b:1},{n:'Miguelito tradicional ~950 g',q:'micheladas y escarchados',p:75,b:1},
{n:'Chamoy tradicional 1.1 kg',q:'micheladas y escarchados',p:60,b:1},{n:'Escarcha mora azul 1.1 kg',q:'azulitos',p:60,b:1},
{n:'Absolut frutos rojos 2 × 200 ml',q:'pon lo que pagaste',p:0,b:1},
{n:'Caguamas (3 cartones de 12 a $475)',q:'30 necesarias',p:1425,b:0},{n:'Sprite 3 × 3 L',q:'azulitos',p:135,b:0},
{n:'Curazao 1 L',q:'azulitos',p:90,b:0},{n:'Agua mineral 2 × 1.75 L',q:'faltan ~3.4 L',p:57,b:0},
{n:'Limón ~110 pzas',q:'mojitos y micheladas',p:120,b:0},{n:'Hierbabuena',q:'~29 porciones',p:60,b:0},
{n:'Azúcar 1 kg',q:'mojitos',p:28,b:0},{n:'Sal 250 g',q:'micheladas',p:10,b:0},
{n:'Hielo 3 bolsas de 5 kg',q:'todo',p:114,b:0},{n:'Gasolina / traslado',q:'pendiente',p:0,b:0}]});
let S=load(),view='caja',cart={},nm='',meth='Efectivo',rec='';
function load(){try{return JSON.parse(localStorage.getItem(K))||DEF()}catch(e){return DEF()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const m=n=>'$'+(Math.round(n*100)/100).toLocaleString('es-MX',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>S.prods.find(p=>p.id===id);
const cartTotal=()=>Object.entries(cart).reduce((a,[k,v])=>a+v*P(k).p,0);
const lineTxt=o=>Object.entries(o.it).map(([k,v])=>v+' × '+esc(P(k)?P(k).n:k)).join(', ');
function go(t){view=t;render()}
function render(){
 const T=[['caja','🧾 Caja'],['cola','⏳ Cola'],['dash','📊 Dashboard'],['compras','🛒 Compras'],['aj','⚙️ Ajustes']];
 $nav.innerHTML=T.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $v.innerHTML={caja,cola,dash,compras,aj}[view]();
}
const $v=document.getElementById('v'),$nav=document.getElementById('nav');
/* ---- CAJA ---- */
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];render()}
function caja(){
 const t=cartTotal(),L=Object.entries(cart);
 return `<div class="grid">${S.prods.map(p=>`<button class="prod" onclick="add('${p.id}',1)"><span class="em">${p.e}</span><b>${esc(p.n)}</b><small>${m(p.p)}</small>${cart[p.id]?`<i class="bdg">${cart[p.id]}</i>`:''}</button>`).join('')}</div>
 <div class="card"><h3>Pedido #${S.seq+1}</h3>
 <input placeholder="¿A nombre de quién?" value="${esc(nm)}" oninput="nm=this.value" autocomplete="off">
 ${L.map(([k,v])=>`<div class="it"><span>${esc(P(k).n)}<small>${m(P(k).p)} c/u</small></span><button class="sm" onclick="add('${k}',-1)">−</button><b>${v}</b><button class="sm" onclick="add('${k}',1)">+</button></div>`).join('')||'<p class="mu">Toca un producto para empezar.</p>'}
 <div class="chips">${MET.map(x=>`<button class="sm ${meth===x?'on':''}" onclick="meth='${x}';render()">${x}</button>`).join('')}</div>
 ${meth==='Efectivo'?`<input type="number" inputmode="decimal" placeholder="Recibido" value="${rec}" oninput="rec=this.value;chg()"><p>Cambio: <b id="chg">${chgTxt(t)}</b></p>`:''}
 <div class="row"><span class="tot">${m(t)}</span><span><button onclick="cart={};nm='';rec='';render()">Limpiar</button> <button class="pri" onclick="send()">Cobrar y enviar a cola</button></span></div></div>`}
function chgTxt(t){return rec===''?'—':(+rec>=t?m(+rec-t):'faltan '+m(t-rec))}
function chg(){document.getElementById('chg').textContent=chgTxt(cartTotal())}
function send(){
 if(!Object.keys(cart).length)return alert('Agrega al menos un producto.');
 S.seq++;S.orders.push({id:S.seq,name:nm.trim()||'Sin nombre',it:{...cart},total:cartTotal(),method:meth,paid:meth!=='Por cobrar',st:0,t:Date.now()});
 save();cart={};nm='';rec='';render()}
/* ---- COLA ---- */
function adv(id){const o=S.orders.find(x=>x.id===id);o.st++;save();render()}
function pay(id,mt){const o=S.orders.find(x=>x.id===id);o.paid=true;o.method=mt;save();render()}
function del(id){if(confirm('¿Cancelar el pedido #'+id+'?')){S.orders=S.orders.filter(x=>x.id!==id);save();render()}}
function cola(){
 const L=S.orders.filter(o=>o.st<3).sort((a,b)=>a.id-b.id),done=S.orders.length-L.length;
 return (L.length?L.map(o=>`<div class="card ord s${o.st}"><div class="row"><h3>#${o.id} ${esc(o.name)}</h3><span class="tag">${ST[o.st]}</span></div>
 <p>${lineTxt(o)}</p><small>${new Date(o.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</small>
 <div class="row"><span>${m(o.total)} · ${o.paid?esc(o.method):'<b class="bad">Por cobrar</b>'}</span><button class="pri sm" onclick="adv(${o.id})">${['Preparar','Marcar listo','Entregar'][o.st]}</button></div>
 ${o.paid?'':`<div class="chips">${MET.slice(0,3).map(x=>`<button class="sm" onclick="pay(${o.id},'${x}')">Cobrar ${x.toLowerCase()}</button>`).join('')}</div>`}
 <button class="sm" onclick="del(${o.id})">Cancelar pedido</button></div>`).join(''):'<p class="mu">No hay pedidos en cola. Cuando cobres uno en la caja aparece aquí, en orden de llegada.</p>')+`<p class="mu">Entregados: ${done}</p>`}
/* ---- DASHBOARD ---- */
function stats(){
 let inc=0,card=0,pend=0,cogs=0,n={};
 S.orders.forEach(o=>{o.paid?(inc+=o.total,o.method==='Tarjeta'&&(card+=o.total)):pend+=o.total;for(const k in o.it){n[k]=(n[k]||0)+o.it[k];cogs+=o.it[k]*(P(k)?P(k).c:0)}});
 return{inc,pend,cogs,n,fee:card*S.fee/100,inv:S.items.reduce((a,i)=>a+i.p,0)}}
function dash(){
 const s=stats(),net=s.inc-s.fee,gan=net-s.inv,pct=s.inv?Math.min(100,Math.max(0,net/s.inv*100)):0,open=S.orders.filter(o=>o.st<3).length;
 return `<div class="k"><div class="card"><small>Ingreso cobrado</small><b>${m(s.inc)}</b></div><div class="card"><small>Por cobrar</small><b>${m(s.pend)}</b></div>
 <div class="card"><small>Inversión total</small><b>${m(s.inv)}</b></div><div class="card"><small>Comisión terminal ${S.fee}%</small><b>${m(s.fee)}</b></div></div>
 <div class="card"><h3>${gan>=0?'Ya recuperaste la inversión':'Recuperación de la inversión'}</h3><div class="bar"><i style="width:${pct}%"></i></div>
 <p>${Math.round(pct)}% · ${gan>=0?'Ganancia neta':'Faltan para empatar'}: <b class="${gan>=0?'ok':'bad'}">${m(Math.abs(gan))}</b></p>
 <small>Ganancia sobre el costo de lo vendido: ${m(net-s.cogs)}</small></div>
 <div class="card"><h3>Ventas por producto</h3><table><tr><th>Producto</th><th>Vendidos</th><th>Plan</th></tr>${S.prods.map(p=>`<tr><td>${esc(p.n)}</td><td>${s.n[p.id]||0}</td><td class="mu">${p.plan}</td></tr>`).join('')}</table>
 <p class="mu">Pedidos: ${S.orders.length} · en cola: ${open}</p></div>`}
/* ---- COMPRAS ---- */
function tg(i){S.items[i].b=S.items[i].b?0:1;save();render()}
function pr(i,v){S.items[i].p=+v||0;save();render()}
function addItem(){const n=prompt('¿Qué compraste o te falta?');if(!n)return;const p=+prompt('Precio','0')||0;S.items.push({n,q:'',p,b:0});save();render()}
function compras(){
 const sp=S.items.filter(i=>i.b).reduce((a,i)=>a+i.p,0),fl=S.items.filter(i=>!i.b).reduce((a,i)=>a+i.p,0),inv=sp+fl,pot=S.prods.reduce((a,p)=>a+p.plan*p.p,0);
 const row=(i,x)=>`<label class="it"><input type="checkbox" ${i.b?'checked':''} onchange="tg(${x})"><span>${esc(i.n)}<small>${esc(i.q)}</small></span><input type="number" inputmode="decimal" value="${i.p}" onchange="pr(${x},this.value)"></label>`;
 const part=b=>S.items.map((i,x)=>!!i.b===b?row(i,x):'').join('');
 return `<div class="k"><div class="card"><small>Ya gastado</small><b>${m(sp)}</b></div><div class="card"><small>Falta por comprar</small><b>${m(fl)}</b></div>
 <div class="card"><small>Inversión total</small><b>${m(inv)}</b></div><div class="card"><small>Ingreso si vendes el plan</small><b>${m(pot)}</b></div></div>
 <div class="card"><h3>Ganancia proyectada</h3><p>Vendiendo 100%: <b class="${pot-inv>=0?'ok':'bad'}">${m(pot-inv)}</b><br>Vendiendo 70%: <b class="${pot*.7-inv>=0?'ok':'bad'}">${m(pot*.7-inv)}</b><br>Empatas vendiendo ~${pot?Math.round(inv/pot*100):0}% del plan</p>
 <small>Sin comisión de terminal. Cambia precios abajo o el plan en Ajustes.</small></div>
 <div class="card"><h3>Falta por comprar</h3>${part(false)||'<p class="ok">Ya compraste todo 🎉</p>'}</div>
 <div class="card"><h3>Ya comprado</h3>${part(true)}</div><button onclick="addItem()">+ Agregar gasto o compra</button>`}
/* ---- AJUSTES ---- */
function pf(i,k,v){S.prods[i][k]=k==='n'?v:(+v||0);save()}
function aj(){
 return `<div class="card"><h3>Precios, costos y plan</h3><small>Costo = lo que gastas en insumos por unidad. Plan = cuántas piensas vender.</small>
 <table><tr><th>Producto</th><th>Precio</th><th>Costo</th><th>Plan</th></tr>${S.prods.map((p,i)=>`<tr><td>${esc(p.n)}</td>${['p','c','plan'].map(k=>`<td><input type="number" inputmode="decimal" value="${p[k]}" onchange="pf(${i},'${k}',this.value)"></td>`).join('')}</tr>`).join('')}</table></div>
 <div class="card"><h3>Comisión de la terminal (%)</h3><input type="number" inputmode="decimal" value="${S.fee}" onchange="S.fee=+this.value||0;save()"></div>
 <div class="card"><h3>Respaldo</h3><p><button onclick="csv()">Descargar pedidos (CSV)</button> <button onclick="bak()">Respaldo completo (JSON)</button></p>
 <small>Los datos viven en este navegador. Descarga un respaldo al cerrar cada día.</small></div>
 <button onclick="if(confirm('¿Borrar pedidos y volver a los valores iniciales?')){S=DEF();save();render()}">Reiniciar todo</button>`}
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 dl('\ufeff'+['Pedido,Nombre,Productos,Total,Método,Pagado,Estado,Hora'].concat(S.orders.map(o=>[o.id,q(o.name),q(lineTxt(o).replace(/&amp;/g,'&')),o.total,o.method,o.paid?'sí':'no',ST[o.st],new Date(o.t).toLocaleString('es-MX')].join(','))).join('\n'),'pedidos-halloween.csv','text/csv')}
function bak(){dl(JSON.stringify(S),'respaldo-halloween.json','application/json')}
render();
</script>
</body>
</html>
